name: Deploy Varnish VCL to Hetzner

# ─── Trigger ─────────────────────────────────────────────────────────────────
# Path-filter: only runs when the VCL, this workflow, or the bootstrap runbook
# changes. README-only, app/*, or lib/* pushes don't fire it — no CI noise for
# work that doesn't touch the origin cache.
#
# Adds workflow_dispatch as a manual escape hatch (initial bootstrap, forced
# reloads, redeploy after Hetzner-side ops changes).

on:
  push:
    branches: [master]
    paths:
      - 'varnish/**'
      - '.github/workflows/deploy-varnish-hetzner.yml'
      - 'docs/runbooks/hetzner-varnish-bootstrap.md'
  workflow_dispatch:
    inputs:
      force_full_reload:
        description: 'systemctl reload varnish (instead of hot vcl.load) — use if VCL structure changed'
        required: false
        default: 'false'

concurrency:
  # One deploy at a time per branch. Superseded runs are cancelled so we never
  # queue up two competing vcl.load calls if pushes land back-to-back.
  group: hetzner-varnish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: scp VCL + hot-reload
    runs-on: ubuntu-latest
    # Restrict who can trigger — deploy-secret access only for master pushes
    # by repo maintainers. workflow_dispatch inherits the same check.
    environment: hetzner-prod
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Only need the VCL file — shallow clone is fine and faster.
          fetch-depth: 1

      - name: Validate VCL locally with varnishd -Cf
        # Fails the job before touching Hetzner if the VCL has a syntax error.
        # Uses the same major version we run in prod (7.3-alpine matches the
        # Debian-shipped varnish package on Bookworm).
        run: |
          docker run --rm -v "${{ github.workspace }}/varnish:/etc/varnish:ro" \
            varnish:7.3-alpine varnishd -Cf /etc/varnish/hetzner.vcl > /dev/null
          echo "✓ VCL syntax valid"

      - name: Copy VCL to Hetzner
        # scp-action carries the deploy key as an in-memory secret; the key
        # never lands on the runner's disk. Uses the strict host-key check
        # against HETZNER_HOST_FINGERPRINT so a compromised DNS record can't
        # MITM the transfer.
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          fingerprint: ${{ secrets.HETZNER_HOST_FINGERPRINT }}
          port: ${{ secrets.HETZNER_SSH_PORT || 22 }}
          source: 'varnish/hetzner.vcl'
          # Upload to a staging path first — the ssh step below validates
          # again against the *installed* varnishd (which may have modules
          # the docker image doesn't) before promoting to /etc/varnish/.
          target: '/tmp/varnish-deploy'
          strip_components: 1
          overwrite: true

      - name: Hot-reload Varnish via varnishadm
        # varnishadm vcl.load/vcl.use is the graceful path — no connection
        # drops, no queued-request loss. Fallback to `systemctl reload` only
        # if force_full_reload was passed via workflow_dispatch.
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          fingerprint: ${{ secrets.HETZNER_HOST_FINGERPRINT }}
          port: ${{ secrets.HETZNER_SSH_PORT || 22 }}
          # Bail fast on the first failure. The install/validate/promote sequence
          # is fail-safe: if vcl.load fails, the running VCL is untouched.
          script_stop: true
          script: |
            set -euo pipefail
            VCL_LABEL="deploy-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:8}"
            # scp uploaded varnish/hetzner.vcl → /tmp/varnish-deploy/hetzner.vcl
            # (strip_components: 1 removed the leading `varnish/`). Target is the
            # canonical /etc/varnish/default.vcl because the systemd override
            # points varnishd -f at that path. See docs/runbooks/…
            STAGE=/tmp/varnish-deploy/hetzner.vcl
            TARGET=/etc/varnish/default.vcl

            # Fresh installed-varnishd syntax check (catches missing modules
            # that the docker image had but Debian doesn't, or vice versa).
            sudo varnishd -Cf "$STAGE" > /dev/null
            echo "✓ installed varnishd accepts the VCL"

            # Atomic replace — same-partition mv, no torn read.
            sudo install -o root -g root -m 0644 "$STAGE" "$TARGET"

            if [ "${{ github.event.inputs.force_full_reload || 'false' }}" = "true" ]; then
              echo "→ workflow_dispatch requested full reload"
              sudo systemctl reload varnish
              sudo systemctl status varnish --no-pager --lines=5
            else
              echo "→ hot vcl.load + vcl.use (no dropped connections)"
              sudo varnishadm vcl.load "$VCL_LABEL" "$TARGET"
              sudo varnishadm vcl.use "$VCL_LABEL"
              # Optional: discard old VCLs older than 10 loads to reclaim slots.
              # Keep the immediately-previous label in case we need to roll back.
              sudo varnishadm vcl.list | \
                awk '$1=="available" && $2!="'"$VCL_LABEL"'"' | \
                head -n -2 | awk '{print $4}' | \
                xargs -r -I {} sudo varnishadm vcl.discard {}
              echo "✓ active VCL is now $VCL_LABEL"
            fi

            # Smoke test — Varnish should still be responding on :80.
            curl -sf -o /dev/null -w "smoke: HTTP %{http_code}\n" http://127.0.0.1:80/wp-json/ || true

            rm -f "$STAGE"

      - name: Post-deploy summary
        if: always()
        run: |
          echo "### Hetzner Varnish deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA:0:8}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- VCL label: \`deploy-*-${GITHUB_SHA:0:8}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reload mode: ${{ github.event.inputs.force_full_reload == 'true' && 'systemctl reload' || 'varnishadm hot-reload' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Rollback:** SSH to Hetzner, run \`sudo varnishadm vcl.list\` to see prior labels, then \`sudo varnishadm vcl.use <previous-label>\`." >> "$GITHUB_STEP_SUMMARY"
